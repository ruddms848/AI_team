<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 모델링 코치 에이전트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --ink:#0f172a;
    --blue:#2b57ff;
    --blue-deep:#1435c9;
    --teal:#3fd0c9;
    --panel-border:#e6e8ef;
    --muted:#5b6472;
    --link:#3b5bff;
    --bg:#ffffff;
    
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ink);
    background:var(--bg);
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 420px;
    gap:40px;
  }

  /* ---------- decorative background ---------- */
  .bg-decor{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(0px);
  }
  .blob-1{
    width:760px;height:760px;
    right:-260px; top:-220px;
    background:radial-gradient(circle at 30% 30%, #bfe9ff 0%, #8fd8ea 45%, transparent 70%);
    opacity:.85;
  }
  .blob-2{
    width:640px;height:640px;
    right:-180px; top:60px;
    background:radial-gradient(circle at 40% 40%, #5cc7e0 0%, #2f8fd6 55%, transparent 75%);
    opacity:.55;
  }
  .stripes{
    position:absolute;
    right:-120px; bottom:-160px;
    width:900px; height:520px;
    background:repeating-linear-gradient(
      100deg,
      rgba(255,255,255,.9) 0px,
      rgba(255,255,255,.9) 2px,
      transparent 2px,
      transparent 7px
    ),
    linear-gradient(120deg, #7fe6d8 0%, #4fc9e8 40%, #4a7bf0 100%);
    -webkit-mask-image: linear-gradient(to top, black 30%, transparent 92%);
            mask-image: linear-gradient(to top, black 30%, transparent 92%);
    transform: rotate(-3deg);
    border-radius:40px;
    opacity:.9;
  }
  .diag-line{
    position:absolute;
    right:120px; top:0; bottom:0;
    width:2px;
    background:rgba(15,23,42,.06);
    transform:skewX(-8deg);
  }

  /* ---------- left hero content ---------- */
  .hero{
    position:relative;
    z-index:1;
    padding:64px 24px 64px 88px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:100vh;
    max-width:900px;
  }

  .headline{
    font-size:64px;
    line-height:1.18;
    font-weight:900;
    letter-spacing:-0.01em;
    margin:0 0 28px 0;
  }
  .headline .black{ color:var(--ink); }
  .headline .accent{
    display:inline-block;
    background:linear-gradient(92deg, #2b57ff 0%, #1a3ed6 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .lede{
    font-size:16.5px;
    line-height:1.75;
    color:var(--muted);
    max-width:620px;
    margin:0 0 44px 0;
  }
  .lede a{
    color:var(--link);
    text-decoration:underline;
    text-underline-offset:2px;
    font-weight:500;
  }

  .hero-image{
    width:100%;
    max-width:640px;
  }
  .hero-image img{
    display:block;
    width:100%;
    height:auto;
    border-radius:20px;
    box-shadow:0 12px 32px rgba(15,23,42,.12);
  }

  /* ---------- stats panel (top of chat) ---------- */
  .stats-panel{
    padding:16px 20px;
    border-bottom:1px solid var(--panel-border);
    background:#fafbfd;
  }
  .stats-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .stats-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .stats-refresh{
    font-size:11.5px;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .stats-refresh:hover{ color:var(--blue); }
  .stats-refresh svg{ width:12px; height:12px; }

  .level-cards{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:12px;
  }
  .level-card{
    border-radius:10px;
    padding:10px 8px;
    text-align:center;
  }
  .level-card.high{ background:#eaf7ee; }
  .level-card.mid{ background:#fff6e0; }
  .level-card.low{ background:#fdeceb; }
  .level-card .lv-count{
    font-size:20px;
    font-weight:900;
    line-height:1.1;
  }
  .level-card.high .lv-count{ color:#1f9d55; }
  .level-card.mid .lv-count{ color:#c98a00; }
  .level-card.low .lv-count{ color:#dd4b3e; }
  .level-card .lv-label{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }

  .student-table{
    max-height:150px;
    overflow-y:auto;
    border-radius:10px;
    border:1px solid var(--panel-border);
  }
  .student-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    font-size:12.5px;
    border-bottom:1px solid #f0f2f6;
  }
  .student-row:last-child{ border-bottom:none; }
  .student-name{
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:120px;
  }
  .student-rate{
    font-weight:700;
    font-size:12px;
  }
  .student-rate.high{ color:#1f9d55; }
  .student-rate.mid{ color:#c98a00; }
  .student-rate.low{ color:#dd4b3e; }
  .stats-empty{
    padding:14px 4px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
  }

  /* ---------- name capture overlay ---------- */
  .name-overlay{
    position:absolute;
    inset:0;
    z-index:5;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    padding:32px;
    text-align:center;
  }
  .name-overlay .ni-emoji{ font-size:32px; }
  .name-overlay h3{
    margin:0;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .name-overlay p{
    margin:0;
    font-size:13px;
    color:var(--muted);
    max-width:280px;
    line-height:1.6;
  }
  .name-form{
    display:flex;
    gap:8px;
    width:100%;
    max-width:280px;
  }
  .name-form input{
    flex:1;
    padding:11px 14px;
    border:1px solid var(--panel-border);
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
    outline:none;
  }
  .name-form input:focus{ border-color:var(--blue); }
  .name-form button{
    padding:11px 16px;
    border:none;
    border-radius:10px;
    background:var(--blue);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .name-form button:hover{ background:var(--blue-deep); }

  /* ---------- right chat panel ---------- */
  .chat-wrap{
    position:relative;
    z-index:1;
    padding:24px 24px 24px 0;
    display:flex;
    align-items:stretch;
  }
  .chat-panel{
    width:100%;
    background:#fff;
    border:1px solid var(--panel-border);
    border-radius:20px;
    box-shadow:0 8px 30px rgba(15,23,42,.06);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .chat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 22px;
    border-bottom:1px solid var(--panel-border);
  }
  .chat-title{
    font-size:15.5px;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .chat-title .sub{
    font-weight:400;
    font-size:13px;
    color:var(--muted);
  }
  .icon-btn{
    width:28px; height:28px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted);
    cursor:pointer;
    transition:background .15s ease;
  }
  .icon-btn:hover{ background:#f2f4f8; }

  .chat-body{
    flex:1;
    min-height:460px;
    position:relative;
  }
  .agent-frame{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  .frame-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:var(--muted);
    font-size:13.5px;
    background:#fff;
    transition:opacity .25s ease;
  }
  .spinner{
    width:22px;height:22px;
    border-radius:50%;
    border:2.5px solid #e6e8ef;
    border-top-color:var(--blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  @media (max-width: 980px){
    .stage{ grid-template-columns:1fr; }
    .hero{ padding:48px 24px; min-height:auto; }
    .headline{ font-size:42px; }
    .chat-wrap{ padding:0 24px 48px 24px; }
    .chat-body{ min-height:360px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="bg-decor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="stripes"></div>
  </div>

  <!-- 왼쪽: 히어로 -->
  <div class="hero">
    <h2 class="headline">
      <span class="black">저는 여러분의</span><br>
      <span class="accent">인공지능기초 학습 지원 에이전트입니다.</span>
    </h2>
    <p class="lede">
      이 사이트는 여러분이 인공지능기초 학습을 하는 공간입니다.
      채팅 창에서 질문을 하거나 아래에서 프롬프트를 선택하세요. <a href="#">자세히 알아보기</a>
    </p>

    <div class="hero-image">
      <img src="AI.png" alt="BASIC AI - Learn, Understand, Create">
    </div>
  </div>

  <!-- 오른쪽: 챗봇 패널 -->
  <div class="chat-wrap">
    <div class="chat-panel">
      <div class="stats-panel">
        <div class="stats-header">
          <div class="stats-title">📊 학습 현황</div>
          <div class="stats-refresh" id="statsRefresh">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M18 3v4h-4M6 21v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            새로고침
          </div>
        </div>

        <div class="level-cards">
          <div class="level-card high">
            <div class="lv-count" id="countHigh">-</div>
            <div class="lv-label">상 (80%+)</div>
          </div>
          <div class="level-card mid">
            <div class="lv-count" id="countMid">-</div>
            <div class="lv-label">중 (50~79%)</div>
          </div>
          <div class="level-card low">
            <div class="lv-count" id="countLow">-</div>
            <div class="lv-label">하 (~49%)</div>
          </div>
        </div>

        <div class="student-table" id="studentTable">
          <div class="stats-empty">학습 데이터를 불러오는 중...</div>
        </div>
      </div>

      <div class="chat-body">
        <div class="name-overlay" id="nameOverlay">
          <div class="ni-emoji">👋</div>
          <h3>시작하기 전에</h3>
          <p>부를 이름이나 별명을 알려줘! 학습 현황을 기록하는 데 쓰여 (실명 아니어도 괜찮아)</p>
          <div class="name-form">
            <input type="text" id="nameInput" placeholder="이름 또는 별명" maxlength="20">
            <button id="nameSubmit">시작</button>
          </div>
        </div>
        <div class="frame-loading" id="frameLoading" style="display:none;">
          <div class="spinner"></div>
          <span>에이전트를 불러오는 중...</span>
        </div>
        <iframe
          id="agentFrame"
          class="agent-frame"
          title="AI 모델링 코치 에이전트"
          allow="microphone"
        ></iframe>
      </div>
    </div>
  </div>
</div>

<script>
  const frame = document.getElementById('agentFrame');
  const loading = document.getElementById('frameLoading');
  const nameOverlay = document.getElementById('nameOverlay');
  const nameInput = document.getElementById('nameInput');
  const nameSubmit = document.getElementById('nameSubmit');

  const AGENT_BASE_URL = "https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_mllearningcoachparentagent_xDY0PB/webchat?__version__=2&enableFileAttachment=false&cliAgent=true";
  const STORAGE_KEY = "quizAgent_studentName";

  frame.addEventListener('load', ()=>{
    loading.style.opacity = '0';
    setTimeout(()=> loading.style.display = 'none', 250);
  });

  function startAgent(studentName){
    nameOverlay.style.display = 'none';
    loading.style.display = 'flex';
    const url = AGENT_BASE_URL + "&UserName=" + encodeURIComponent(studentName);
    frame.src = url;
  }

  function handleNameSubmit(){
    const value = nameInput.value.trim();
    if(!value) { nameInput.focus(); return; }
    localStorage.setItem(STORAGE_KEY, value);
    startAgent(value);
  }

  nameSubmit.addEventListener('click', handleNameSubmit);
  nameInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') handleNameSubmit();
  });

  // 페이지 로드 시 저장된 이름이 있으면 바로 시작, 없으면 입력창 표시
  const savedName = localStorage.getItem(STORAGE_KEY);
  if(savedName){
    startAgent(savedName);
  } else {
    nameOverlay.style.display = 'flex';
    nameInput.focus();
  }

  // ============================================================
  // ⚠️ 여기를 꼭 수정하세요 — Google Apps Script 웹 앱 URL
  // ============================================================
  // 1) Google Sheets에서 "확장 프로그램 → Apps Script"로 코드 작성
  // 2) 상단 "배포 → 새 배포 → 웹 앱" 선택, 액세스 권한 "모든 사용자"로 배포
  // 3) 배포 완료 후 나오는 URL을 복사해서 아래 큰따옴표 안에 그대로 붙여넣기
  //
  //    실제로 이렇게 생긴 주소예요 (아래는 예시일 뿐, 그대로 쓰면 안 됨):
  //    "https://script.google.com/macros/s/AKfycbxJ3kL9pQ2rT8vW1xY4zA6bC7dE9fG0hI2jK3lM4nO5pQ6rS7tU8vW9xY0zA1b/exec"
  //
  //    ↓↓↓ 아래 줄의 따옴표 안 내용을, 위와 같은 형태의 "본인 URL"로 교체하세요 ↓↓↓
  const STATS_API_URL = "여기에_Apps_Script_웹앱_URL을_붙여넣으세요";
  // ============================================================

  const countHigh = document.getElementById('countHigh');
  const countMid = document.getElementById('countMid');
  const countLow = document.getElementById('countLow');
  const studentTable = document.getElementById('studentTable');
  const statsRefresh = document.getElementById('statsRefresh');

  function levelClass(level){
    if(level === '상') return 'high';
    if(level === '중') return 'mid';
    return 'low';
  }

  async function loadStats(){
    if(!STATS_API_URL || STATS_API_URL.indexOf('여기에') === 0){
      studentTable.innerHTML = '<div class="stats-empty"><br></div>';
      return;
    }
    try{
      studentTable.innerHTML = '<div class="stats-empty">불러오는 중...</div>';
      const res = await fetch(STATS_API_URL);
      const data = await res.json();

      countHigh.textContent = data.levelCounts?.['상'] ?? 0;
      countMid.textContent = data.levelCounts?.['중'] ?? 0;
      countLow.textContent = data.levelCounts?.['하'] ?? 0;

      if(!data.students || data.students.length === 0){
        studentTable.innerHTML = '<div class="stats-empty">아직 학습 데이터가 없습니다</div>';
        return;
      }

      // 정답률 높은 순으로 정렬
      const sorted = [...data.students].sort((a,b)=> b.rate - a.rate);

      studentTable.innerHTML = sorted.map(s => `
        <div class="student-row">
          <span class="student-name">${s.studentId}</span>
          <span class="student-rate ${levelClass(s.level)}">${s.rate}% (${s.correct}/${s.total})</span>
        </div>
      `).join('');
    }catch(err){
      studentTable.innerHTML = '<div class="stats-empty">데이터를 불러오지 못했습니다</div>';
      console.error(err);
    }
  }

  statsRefresh.addEventListener('click', loadStats);
  loadStats();
  // 60초마다 자동 새로고침 (선택 사항)
  setInterval(loadStats, 60000);
</script>

</body>
</html>
